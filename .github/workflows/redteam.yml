# Red-team gate. Free checks run on every pull request; the live smoke run (Claude API,
# costs money) runs only when started by hand and the ANTHROPIC_API_KEY secret exists.
name: redteam
on:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Run the live smoke set against the Claude API (costs money)"
        type: boolean
        default: false
jobs:
  harness:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: redteam/harness } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run selftest
      - name: Live smoke (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: npm run smoke
  noizybkz:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: noizybkz } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm test
